<!DOCTYPE html><html><head>
  <style>
    body{
      font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      background-color: rgb(216, 197, 200);
    }

    .calculadora {
      background-color: rgb(246, 222, 226);
      width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    .botones {
      display: flex;
    }

    button {
      margin: 4px;
      padding: 10px 15px;
      font-size: 16px;
      border: 1px;
      border-radius: 6px;
      background-color: pink;
      color: rgb(45, 129, 111);
    }

    .big {
      color: rgb(93, 71, 75);
      font-size: 40px;
    }

  </style>

    <title>Ejemplo</title><meta charset="utf-8">
    <script type="text/javascript">

    // Variables globales
    let operando1 = 0;
    let operacion = "";
    

    const vaciar = () => {
      document.getElementById("n1").value = "";
    }

    const validate = (tipo) => {
      let texto = document.getElementById("n1").value;
      let info = document.getElementById("info");

      try {
        if (texto === "") {
          throw ("No has introducido ningún número");
        }

        let lista = texto.split(",");

        if (tipo=="numero" && lista.length > 1) {
          throw("Esta operación solo funciona con un número, no con una lista")
        }

        for (let i = 0; i < lista.length; i++) {
          if (lista[i] === "" || isNaN(lista[i])) {
            throw (`"${lista[i]}" no es un número válido`);
          }
        }

        return true;

      } catch (error) {
        info.innerHTML = "Error: " + error;
        return false;
      }
    }


    const cuadrado = () => {
      if (validate("numero") === false) {
        return;
      }
      let num = document.getElementById("n1");
      num.value = num.value * num.value;
      fill_info();
    }
    

    const inverso = () => {
      if (validate("numero") === false) {
        return;
      }
      try {
        let num = document.getElementById("n1");
        if (Number(num.value) === 0) {
          throw ("No se puede dividir entre 0");
        }
        num.value = 1 / num.value;
        fill_info();
      } catch (error) {
        document.getElementById("info").innerHTML = "Error: " + error;
      }
    }
        
    const mod = () => {
      if (validate("numero") === false) {
        return;
      }
      let num = document.getElementById("n1");
      let x = Number(num.value);
      if (x < 0) {
        num.value = -x;
      } else {
        num.value = x;
      }
      fill_info();
    
    }
    

    const fact = () => {
      if (validate("numero") === false) {
        return;
      }
      try {
        let num = document.getElementById("n1");
        let x = Number(num.value);
        if (x < 0) {
          throw ("No existe el factorial de un número negativo");
        }
        if (x % 1 !== 0) {
          throw ("El factorial solo existe para números enteros");
        }
        let resultado = 1;
        for (let i = 2; i <= x; i++) {
          resultado = resultado * i;
        }
        num.value = resultado;
        fill_info();
      } catch (error) {
        document.getElementById("info").innerHTML = "Error: " + error;
      }
    }

    const cubo = () => {
      if (validate("numero") === false) {
        return;
      }
      let num = document.getElementById("n1");
      num.value = num.value * num.value * num.value;
      fill_info();
    }

    const guardar = (op) => {
      if (validate("numero") === false) {
        return;
      }
      let num = document.getElementById("n1");
      operando1 = Number(num.value);
      operacion = op;
      num.value = "";
    }

    const eq = () => {
      if (validate("numero") === false) {
        return;
      }
      try {
        let num = document.getElementById("n1");
        let operando2 = Number(num.value);
        if (operacion === "") {
          throw ("Primero tienes que elegir una operación (+ o x)");
        }
        if (operacion === "+") {
          num.value = operando1 + operando2;
        } else if (operacion === "*") {
          num.value = operando1 * operando2;
        }
        operacion = "";
        fill_info();
      } catch (error) {
        document.getElementById("info").innerHTML = "Error: " + error;
      }
    }

    const multiplication = () => {
      guardar("*")
    }

    const addition = () => {
      guardar("+")
    }

    const sum = () => {
        if (validate("lista") === false) {
            return;
        }
        let num = document.getElementById("n1");
        let lista = num.value.split(",");
        let total = 0;

        for (let i = 0; i < lista.length; i++) {
            total = total + Number(lista[i]);
        }

        num.value = total;
        fill_info();
    }

    const sort = () => {
        if (validate("lista") === false) {
            return;
        }
        let num = document.getElementById("n1");
        let lista = num.value.split(",");
        lista.sort((a, b) => a - b);
        num.value = lista.join(",");
        document.getElementById("info").innerHTML = `Info: La lista ordenada de menor a mayor es ${num.value}`;
    }

    const reverse = () => {
        if (validate("lista") === false ) {
            return;
        }
        let num = document.getElementById("n1");
        let lista = num.value.split(",");
        lista.reverse();
        num.value=lista.join(",")
        document.getElementById("info").innerHTML = `Info: La lista ordenada de forma invertida es ${num.value}`;
    }

    const removelast = () => {
        if (validate("lista") === false ) {
            return;
        }
        let num = document.getElementById("n1");
        let lista = num.value.split(",");
        lista.pop();
        num.value=lista.join(",")
        document.getElementById("info").innerHTML = `Info: Se ha eliminado el último elemento. La lista queda: ${num.value}`;
    }

    const media =() => {
        if (validate("lista") === false ) {
            return;
        }
        let num = document.getElementById("n1");
        let lista = num.value.split(",");
        let total = 0;

        for(let i=0; i<lista.length;i++){
            total=(total + Number(lista[i]))
        }

        num.value=total/lista.length;
        fill_info();
        }


    const fill_info = () => {                        
      let num = document.getElementById("n1");         
      let info = document.getElementById("info");      
      let resultado = Number(num.value);  
    

        if (resultado < 100) {
        info.innerHTML = `Info: El resultado es ${resultado}, menor que 100`;
      } else if (resultado <= 200){
        info.innerHTML=`Info: El resultado es ${resultado}, esta entre 100 y 200`;
      } else {
        info.innerHTML=`Info: El resultado es ${resultado}, es mayor que 200`;
      } 
    }

    </script>
    </head>

    <body>
        <div class="calculadora">

            <h1>Calculadora pequeña</h1>

    
            Número:
            <input type="text" id="n1" onclick="vaciar()">
            <br><br>

            <h3>Operaciones unarias</h3>
            <div class="botones">
                <button onclick="cuadrado()">x<sup>2</sup></button>
                <button onclick="inverso()"> 1/x </button>
                <button id="modulo" onclick="mod()"> | x | </button>  
                <button id="factorial" onclick="fact()" > n! </button>
                <button onclick="cubo()">x<sup>3</sup></button>
            </div>

            <h3>Operaciones binarias</h3>
            <div class="botones">
                <button onclick="addition()">+</button>
                <button onclick="multiplication()">x</button>
                <button onclick="eq()"> = </button>
            </div>

            <h3>Operaciones con csv</h3>
            <div class="botones">
                <button onclick="sum()">Suma</button>
                <button onclick="sort()">Ordena</button>
                <button onclick="reverse()">Invierte</button>
                <button onclick="removelast()">Elimina último</button>
                <button onclick="media()">Media </button>
            </div>

            <h2 id="info" class="big" title="Información sobre el número"> Información sobre el número </h2>
        </div>
    </body>
</html>
